[GENERAL]
# Enable or disable the script execution
Enabled: False
# First run `sudo throttled --probe`; enable only after reviewing the hardware report.
# SYSFS path for checking if the system is running on AC power
# (every matching adapter is checked; any one online means AC)
Sysfs_Power_Path: /sys/class/power_supply/AC*/online
# Auto reload config on changes
Autoreload: True

## Settings to apply while connected to Battery power
[BATTERY]
# Update the registers every this many seconds
Update_Rate_s: 30
# Max package power for time window #1
# PL1_Tdp_W: 29
# PL1_Enable: True
# PL1_Clamp: True
# Time window #1 duration
# PL1_Duration_s: 28
# Max package power for time window #2
# PL2_Tdp_W: 44
# PL2_Enable: True
# PL2_Clamp: False
# Time window #2 duration
# PL2_Duration_S: 0.002
# Max allowed temperature before throttling
# Trip_Temp_C: 85
# Optional cTDP target: normal=0, down=1 or up=2 (EXPERIMENTAL). Absent = do not touch.
# cTDP: 0
# Optional ThrottleStop-style Speed Shift EPP (0=performance, 255=power saving)
# HWP_EPP: 128
# Optional explicit Turbo policy. If absent, throttled leaves the Turbo Disable bit untouched.
# Disable_Turbo: False
# Explicit reversible BD PROCHOT state (preferred for this fork)
# BDPROCHOT_Enabled: True
# Legacy one-way option: True disables; absent/False leaves the current state untouched
# Disable_BDPROCHOT: False

## Settings to apply while connected to AC power
[AC]
# Update the registers every this many seconds
Update_Rate_s: 5
# Max package power for time window #1
# PL1_Tdp_W: 44
# PL1_Enable: True
# PL1_Clamp: True
# Time window #1 duration
# PL1_Duration_s: 28
# Max package power for time window #2
# PL2_Tdp_W: 44
# PL2_Enable: True
# PL2_Clamp: False
# Time window #2 duration
# PL2_Duration_S: 0.002
# Max allowed temperature before throttling
# Trip_Temp_C: 95
# Set HWP energy performance hints to 'performance' on high load (EXPERIMENTAL)
# Uncomment only if you really want to use it
# HWP_Mode: False
# Preferred direct Speed Shift EPP control (0=performance, 255=power saving)
# HWP_EPP: 32
# Disable Turbo Boost
# Disable_Turbo: False
# Set cTDP to normal=0, down=1 or up=2 (EXPERIMENTAL)
# cTDP: 0
# Explicit reversible BD PROCHOT state (preferred for this fork)
# BDPROCHOT_Enabled: True
# Legacy one-way option: True disables; False leaves the current state untouched
# Disable_BDPROCHOT: False

